<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Plan Review: TT-136: Bundle into review-suite</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg: #0d1117;
      --bg-surface: #161b22;
      --bg-surface-2: #1c2128;
      --bg-hover: #21262d;
      --border: #30363d;
      --border-light: #484f58;
      --text: #e6edf3;
      --text-muted: #8b949e;
      --text-dim: #6e7681;
      --accent: #58a6ff;
      --green: #3fb950;
      --green-bg: rgba(63, 185, 80, 0.10);
      --amber: #d29922;
      --amber-bg: rgba(210, 153, 34, 0.10);
      --red: #f85149;
      --red-bg: rgba(248, 81, 73, 0.08);
      --purple: #bc8cff;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      height: 100vh;
      height: -webkit-fill-available;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* Top bar */
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 20px;
      background: var(--bg-surface);
      border-bottom: 1px solid var(--border);
      height: 52px;
    }

    .topbar h1 {
      font-size: 14px;
      font-weight: 600;
      color: var(--text);
    }

    .topbar .stats {
      display: flex;
      gap: 16px;
      font-size: 12px;
    }

    .stat {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .stat .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
    }

    .dot-pending {
      background: var(--amber);
    }

    .dot-approved {
      background: var(--green);
    }

    .dot-revision {
      background: var(--red);
    }

    .dot-question {
      background: var(--purple);
    }

    /* Main layout */
    .main {
      display: flex;
      flex: 1;
      min-height: 0;
    }

    /* Resize handles */
    .resize-handle {
      width: 1px;
      cursor: col-resize;
      background: var(--border);
      position: relative;
      flex-shrink: 0;
      z-index: 10;
      overflow: visible;
    }

    .resize-handle::after {
      content: '';
      position: absolute;
      top: 0;
      bottom: 0;
      left: -10px;
      right: -10px;
    }

    .resize-handle:hover,
    .resize-handle.dragging {
      background: var(--accent);
      width: 3px;
    }

    body.resizing {
      cursor: col-resize;
      user-select: none;
    }

    /* Topbar collapse toggle buttons */
    .topbar-toggles {
      display: flex;
      gap: 6px;
    }

    .collapse-toggle {
      width: 36px;
      height: 32px;
      background: var(--bg-surface-2);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text-muted);
      font-size: 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
      -webkit-user-select: none;
      user-select: none;
      transition: background 0.3s ease, border-color 0.3s ease, color 0.3s ease;
    }

    @media (hover: hover) {
      .collapse-toggle:hover {
        background: var(--bg-hover);
        color: var(--text);
        border-color: var(--accent);
      }
    }

    .collapse-toggle.panel-collapsed {
      background: var(--accent);
      color: var(--bg);
      border-color: var(--accent);
    }

    /* Collapsed panel states */
    .nav.collapsed {
      width: 0 !important;
      min-width: 0 !important;
      padding: 0 !important;
      overflow: hidden;
    }

    .right-panel.collapsed {
      width: 0 !important;
      min-width: 0 !important;
      overflow: hidden;
    }

    .right-panel.collapsed>* {
      display: none;
    }

    .nav.collapsed>* {
      display: none;
    }

    .nav,
    .right-panel {
      transition: width 0.2s ease, min-width 0.2s ease, padding 0.2s ease;
    }

    /* Section nav */
    .nav {
      width: 240px;
      min-width: 140px;
      background: var(--bg-surface);
      overflow-y: auto;
      padding: 12px 0;
    }

    .nav-item {
      padding: 8px 16px;
      font-size: 12px;
      color: var(--text-muted);
      cursor: pointer;
      border-left: 3px solid transparent;
      transition: all 0.15s;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .nav-item:hover {
      background: var(--bg-hover);
      color: var(--text);
    }

    .nav-item.active {
      background: var(--bg-hover);
      border-left-color: var(--accent);
      color: var(--text);
    }

    .nav-item .status-icon {
      width: 16px;
      height: 16px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
    }

    .nav-item .label {
      flex: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Document panel */
    .doc-panel {
      flex: 1;
      overflow-y: auto;
      padding: 24px 32px;
      min-width: 0;
    }

    .doc-panel::-webkit-scrollbar {
      width: 8px;
    }

    .doc-panel::-webkit-scrollbar-track {
      background: transparent;
    }

    .doc-panel::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: 4px;
    }

    /* Section rendering */
    .section {
      margin-bottom: 16px;
      scroll-margin-top: 20px;
      padding: 16px 16px 10px;
      border-radius: 6px;
    }

    .section-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border);
    }

    .section-header h2 {
      font-size: 18px;
      font-weight: 600;
      flex: 1;
    }

    .section-header h3 {
      font-size: 15px;
      font-weight: 600;
      flex: 1;
    }

    .section-content {
      font-size: 14px;
      line-height: 1.7;
      color: var(--text-muted);
    }

    .section-content p {
      margin-bottom: 12px;
    }

    .section-content strong {
      color: var(--text);
      font-weight: 600;
    }

    .section-content code {
      font-family: 'SF Mono', 'Fira Code', 'JetBrains Mono', monospace;
      font-size: 12px;
      background: var(--bg-surface-2);
      padding: 2px 6px;
      border-radius: 4px;
      color: var(--accent);
    }

    .section-content pre {
      background: var(--bg-surface-2);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 14px;
      margin: 12px 0;
      overflow-x: auto;
      font-family: 'SF Mono', 'Fira Code', 'JetBrains Mono', monospace;
      font-size: 12px;
      line-height: 1.5;
      color: var(--text-muted);
    }

    .section-content pre code {
      background: none;
      padding: 0;
      color: inherit;
    }

    .section-content ul,
    .section-content ol {
      margin: 8px 0 12px 24px;
    }

    .section-content li {
      margin-bottom: 4px;
    }

    .section-content table {
      width: 100%;
      border-collapse: collapse;
      margin: 12px 0;
      font-size: 13px;
    }

    .section-content th,
    .section-content td {
      text-align: left;
      padding: 8px 12px;
      border: 1px solid var(--border);
    }

    .section-content th {
      background: var(--bg-surface-2);
      color: var(--text);
      font-weight: 600;
    }

    .section-content hr {
      border: none;
      border-top: 1px solid var(--border);
      margin: 20px 0;
    }

    /* Review actions */
    .review-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 16px;
      padding-top: 12px;
      border-top: 1px solid var(--border);
    }

    .review-btn {
      padding: 6px 14px;
      font-size: 12px;
      font-weight: 500;
      border: 1px solid var(--border);
      border-radius: 6px;
      cursor: pointer;
      background: var(--bg-surface);
      color: var(--text-muted);
      transition: all 0.15s;
    }

    .review-btn:hover {
      border-color: var(--border-light);
      color: var(--text);
    }

    .review-btn.active-approved {
      background: var(--green-bg);
      border-color: var(--green);
      color: var(--green);
    }

    .review-btn.active-revision {
      background: var(--red-bg);
      border-color: var(--red);
      color: var(--red);
    }

    .review-btn.active-question {
      background: rgba(188, 140, 255, 0.10);
      border-color: var(--purple);
      color: var(--purple);
    }

    .comment-area {
      margin-top: 10px;
      display: none;
    }

    .comment-area.visible {
      display: block;
    }

    .comment-area textarea {
      width: 100%;
      background: var(--bg-surface-2);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      padding: 10px;
      font-family: inherit;
      font-size: 13px;
      resize: vertical;
      min-height: 60px;
      outline: none;
      margin-bottom: 0;
      display: block;
    }

    .comment-area textarea:focus {
      border-color: var(--accent);
    }

    .comment-area textarea::placeholder {
      color: var(--text-dim);
    }

    .existing-comment {
      background: var(--bg-surface-2);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 10px;
      font-size: 13px;
      color: var(--text-muted);
      margin-top: 8px;
      position: relative;
    }

    .existing-comment .edit-btn {
      position: absolute;
      top: 6px;
      right: 8px;
      font-size: 11px;
      color: var(--accent);
      cursor: pointer;
      background: none;
      border: none;
    }

    /* Right panel: prompt output */
    .right-panel {
      width: 360px;
      min-width: 200px;
      background: var(--bg-surface);
      display: flex;
      flex-direction: column;
    }

    .right-panel-header {
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
      font-size: 13px;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .right-panel-content {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
    }

    .right-panel-content::-webkit-scrollbar {
      width: 6px;
    }

    .right-panel-content::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: 3px;
    }

    .prompt-output {
      font-family: 'SF Mono', 'Fira Code', monospace;
      font-size: 12px;
      line-height: 1.6;
      color: var(--text-muted);
      white-space: pre-wrap;
      word-break: break-word;
    }

    .prompt-placeholder {
      color: var(--text-dim);
      font-style: italic;
      font-size: 13px;
      text-align: center;
      padding: 40px 20px;
    }

    .copy-btn {
      padding: 8px 16px;
      margin: 12px 16px 16px;
      background: var(--accent);
      color: #0d1117;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.15s;
    }

    .copy-btn:hover {
      opacity: 0.9;
    }

    .copy-btn.copied {
      background: var(--green);
    }

    /* Filter tabs in right panel */
    .filter-tabs {
      display: flex;
      gap: 2px;
      padding: 8px 16px;
      border-bottom: 1px solid var(--border);
      background: var(--bg-surface);
    }

    .filter-tab {
      padding: 4px 10px;
      font-size: 11px;
      color: var(--text-muted);
      cursor: pointer;
      border-radius: 4px;
      transition: all 0.15s;
    }

    .filter-tab:hover {
      background: var(--bg-hover);
    }

    .filter-tab.active {
      background: var(--bg-hover);
      color: var(--text);
    }

    /* Feedback summary items */
    .feedback-item {
      padding: 10px 0;
      border-bottom: 1px solid var(--border);
      font-size: 13px;
    }

    .feedback-item:last-child {
      border-bottom: none;
    }

    .feedback-item .fb-section {
      font-weight: 600;
      color: var(--text);
      margin-bottom: 4px;
      font-size: 12px;
    }

    .feedback-item .fb-status {
      display: inline-block;
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 3px;
      font-weight: 600;
      margin-right: 6px;
    }

    .fb-status.approved {
      background: var(--green-bg);
      color: var(--green);
    }

    .fb-status.revision {
      background: var(--red-bg);
      color: var(--red);
    }

    .fb-status.question {
      background: rgba(188, 140, 255, 0.1);
      color: var(--purple);
    }

    .feedback-item .fb-comment {
      color: var(--text-muted);
      font-size: 12px;
      margin-top: 4px;
    }

    /* Revised section highlight */
    .section.revised {
      border-left: 3px solid var(--accent) !important;
      background: rgba(88, 166, 255, 0.04) !important;
    }

    .revised-badge {
      display: inline-block;
      font-size: 10px;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 4px;
      background: rgba(88, 166, 255, 0.15);
      color: var(--accent);
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }
    .mermaid-container {
      background: var(--bg-surface-2);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 16px;
      margin: 12px 0;
      overflow-x: auto;
    }

    .mermaid-container svg {
      max-width: 100%;
      height: auto;
    }
    /* Terminal panel (TT-127) */
    .terminal-panel {
      width: 460px;
      min-width: 240px;
      background: var(--bg-surface);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      transition: width 0.2s ease, min-width 0.2s ease;
    }

    .terminal-panel.collapsed {
      width: 0 !important;
      min-width: 0 !important;
      overflow: hidden;
    }

    .terminal-panel.collapsed > * {
      display: none;
    }

    .terminal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 12px;
      background: var(--bg-surface);
      border-bottom: 1px solid var(--border);
      font-size: 12px;
      color: var(--text-muted);
      flex-shrink: 0;
    }

    .terminal-header .term-title {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 600;
      color: var(--text);
    }

    .term-status {
      font-size: 10px;
      letter-spacing: 0.4px;
      text-transform: uppercase;
      padding: 2px 6px;
      border-radius: 3px;
      background: var(--bg-surface-2);
      color: var(--text-dim);
    }

    .term-status.connected {
      color: var(--green);
      background: var(--green-bg);
    }

    .term-status.error {
      color: var(--red);
      background: var(--red-bg);
    }

    .terminal-host {
      flex: 1;
      min-height: 0;
      padding: 6px 8px 8px 8px;
      overflow: hidden;
    }

    .terminal-host .xterm {
      height: 100%;
    }

    /* Browser → terminal handoff footer (TT-130) */
    .handoff-bar {
      padding: 8px 12px;
      background: var(--bg-surface);
      border-top: 1px solid var(--border);
      font-size: 12px;
      color: var(--text-muted);
      flex-shrink: 0;
    }

    .handoff-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .handoff-label {
      color: var(--text-dim);
      font-weight: 600;
    }

    .handoff-sid {
      flex: 1;
      min-width: 0;
      padding: 2px 6px;
      border-radius: 3px;
      background: var(--bg-surface-2);
      color: var(--text);
      font-size: 11px;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .handoff-btn {
      padding: 4px 10px;
      font-size: 11px;
      font-weight: 600;
      color: var(--text);
      background: var(--bg-surface-2);
      border: 1px solid var(--border);
      border-radius: 4px;
      cursor: pointer;
      white-space: nowrap;
    }

    .handoff-btn:hover:not(:disabled) {
      background: var(--bg-surface);
      border-color: var(--text-dim);
    }

    .handoff-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .handoff-status {
      margin-top: 6px;
      font-size: 11px;
      color: var(--text-dim);
      min-height: 14px;
    }

    .handoff-status.done {
      color: var(--green);
    }

    .handoff-status-cmd {
      display: block;
      margin-top: 4px;
      padding: 4px 8px;
      background: var(--bg-surface-2);
      border: 1px solid var(--border);
      border-radius: 3px;
      color: var(--text);
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 11px;
      user-select: all;
      white-space: nowrap;
      overflow-x: auto;
    }

    /* Send to Claude button (TT-127) */
    .send-claude-btn {
      margin: 12px 16px 16px;
      padding: 10px 14px;
      font-size: 13px;
      font-weight: 600;
      color: #0d1117;
      background: var(--accent);
      border: 1px solid var(--accent);
      border-radius: 6px;
      cursor: pointer;
      transition: filter 0.15s;
      font-family: inherit;
    }

    .send-claude-btn:hover {
      filter: brightness(1.1);
    }

    .send-claude-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .send-claude-btn.sent {
      background: var(--green);
      border-color: var(--green);
    }
  </style>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/css/xterm.min.css">
  <script src="https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/lib/xterm.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@xterm/addon-fit@0.10.0/lib/addon-fit.min.js"></script>
</head>

<body>

  <div class="topbar">
    <div class="topbar-toggles">
      <button class="collapse-toggle" id="leftToggle" title="Toggle sections">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
          <rect x="1" y="1" width="4" height="14" rx="1" opacity="0.9" />
          <rect x="7" y="1" width="8" height="14" rx="1" opacity="0.3" />
        </svg>
      </button>
    </div>
    <h1>TT-136: Bundle into review-suite</h1>
    <div class="stats" id="stats"></div>
    <div class="topbar-toggles">
      <button class="collapse-toggle" id="termToggle" title="Toggle terminal">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
          <path d="M2 3h12v10H2V3zm1 1v8h10V4H3z" opacity="0.6"/>
          <path d="M4 6l2 2-2 2M7 10h3" stroke="currentColor" stroke-width="1" fill="none" opacity="0.9"/>
        </svg>
      </button>
      <button class="collapse-toggle" id="rightToggle" title="Toggle feedback">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
          <rect x="1" y="1" width="8" height="14" rx="1" opacity="0.3" />
          <rect x="11" y="1" width="4" height="14" rx="1" opacity="0.9" />
        </svg>
      </button>
    </div>
  </div>

  <div class="main">
    <div class="nav" id="nav"></div>
    <div class="resize-handle" id="leftHandle"></div>
    <div class="doc-panel" id="docPanel"></div>
    <div class="resize-handle" id="termHandle"></div>
    <div class="terminal-panel" id="termPanel">
      <div class="terminal-header">

        content: `Consolidate the four plugins into a single \`review-suite\` plugin in the same \`xmandeng-plugins\` marketplace.

### What you'd install

\`\`\`
/plugin install review-suite@xmandeng-plugins
\`\`\`

Single install gives all five slash commands:

- \`/plan-review\` — interactive HTML review playground for implementation plans
- \`/architecture-review\` — before/after architecture diagrams
- \`/architecture-map\` — concept-map playground
- \`/code-diagram\` — Graphviz diagram generator
- \`/devserver\` — **NEW** — standalone dev server launcher (no ticket/plan required)

All share **one** \`bin/devserver.py\` and **one** \`bin/inject-session-id.sh\`. No more drift.

### What's preserved

- The four legacy plugin directories stay in place for one release (deprecation window).
- Existing \`.plan-review/*.html\` files keep working — \`PLAN_NAME\` and the embedded \`CLAUDE_SESSION\` are baked into the HTML at authoring time, so the browser-side localStorage keys and PTY bridge spawn behavior are unchanged.

### What changes

- Three review SKILL.md files now read **one** unified hook label (\`review-suite-session-id\`) instead of three plugin-specific labels.
- Devserver env-var prefix unifies to \`REVIEW_SUITE_HOST/PORT\` (default port 8765 across the bundle; arch-review's 8775 and arch-map's 8785 retired).
- Each skill's port-scan logic in step 9 starts at 8765 (was 8765/8775/8785). All skills share the same \`.devserver-port\` reuse mechanism.
- Per-skill output directory env vars (\`PLAN_REVIEW_DIR\`, \`ARCHITECTURE_REVIEW_DIR\`, \`ARCHITECTURE_MAP_DIR\`) are **kept** — they map to distinct output directories (\`.plan-review/\`, \`.architecture-review/\`, \`.architecture-map/\`) so generated files don't collide.

### New scope (added during plan review)

- **README rewrite from scratch** — single coherent bundle doc, not stitched together from the four legacy READMEs. One hero section, install command, per-command sections with screenshots/examples, prerequisites (with explicit Graphviz callout for code-diagram only), env vars, PTY-bridge explainer, migration guide.
- **Code-diagram visualization** — self-referential component diagram of review-suite itself, generated via the bundled \`/code-diagram\`, embedded in the README. Doubles as documentation and as a demo of the tool.
- **Code-diagram soft-fail message tightening** — clearer structured message (header, platform-specific install commands, retry hint) when Graphviz is missing.

### How the unified hook label is safe across concurrent sessions

A reasonable concern: if I have one Claude session for plan-review work and another for architecture-map work, doesn't a single shared label collide?

**Answer: no — process isolation does the real work; the label is cosmetic.**

Each Claude process has **its own** hook executions firing in **its own** context. Hook scripts run inside the Claude process — no shared file, no IPC, no cross-session leak. The session id flows through three layers, all bound to whichever process is running:

\`\`\`
Today (3 plugins, 3 hooks):
  Session A (sid AAA) context:        Session B (sid BBB) context:
    plan-review-session-id: AAA         plan-review-session-id: BBB
    arch-review-session-id: AAA         arch-review-session-id: BBB
    arch-map-session-id: AAA            arch-map-session-id: BBB

After bundling (1 hook):
  Session A context:                  Session B context:
    review-suite-session-id: AAA        review-suite-session-id: BBB
\`\`\`

A's context never sees B's labels (or sids). When A's plan-review SKILL greps for the label in its own context, it finds AAA. When B's arch-map SKILL greps in its own context, it finds BBB. Each baked into its own HTML at authoring time.

**The shared devserver routes correctly** because the session id is in the HTML (\`const CLAUDE_SESSION = "AAA"\`) and flows to the WebSocket as \`?session=AAA\`. The devserver spawns \`claude --resume AAA\` (or BBB) per HTML, not per devserver. So one devserver can serve plan-review→A and arch-map→B concurrently without crossing wires.

**The only genuinely shared thing** across sessions is \`<output-dir>/.devserver-port\` — both sessions detect the live port and reuse the same devserver process. That's existing behavior, unaffected by the label change.`

plan-review/SKILL.md:81: ... \`plan-review-session-id: <sid>\` line ...
plan-review/SKILL.md:130: ... \`plan-review-session-id: <sid>\` line ...

\`\`\`

### Code-diagram SKILL.md: tighten soft-fail message + copy

**Decision: ports-only signature.** A directory mount arg would break sharing (devserver started rooted in \`.plan-review/\` couldn't serve subsequent \`/architecture-review\` requests with their \`/.architecture-review/\` URL paths). All review skills already launch from project root; \`/devserver\` matches that protocol.

Thin wrapper. Pseudocode:

\`\`\`bash
# Optional port override (default 8765). No directory arg — always serves project root.
PORT="\${1:-8765}"

# Reuse existing server on the recorded port if running
PORT_FILE=".devserver-port"
if [ -f "$PORT_FILE" ] && lsof -i ":$(cat "$PORT_FILE")" >/dev/null 2>&1; then
  PORT=$(cat "$PORT_FILE")
  echo "Reusing devserver on port $PORT"
else
  # Scan 8765-8799 for a free port
  while lsof -i ":$PORT" >/dev/null 2>&1 && [ "$PORT" -lt 8800 ]; do
    PORT=$((PORT + 1))
  done
  python3 "\${CLAUDE_PLUGIN_ROOT}/bin/devserver.py" "$PORT" &
  echo "$PORT" > "$PORT_FILE"
fi

LAN_IP=$(hostname -I | awk '{print $1}')
echo "Devserver: http://\${LAN_IP}:\${PORT}/"
echo "  Plan-review HTMLs: http://\${LAN_IP}:\${PORT}/.plan-review/"
echo "  Architecture review: http://\${LAN_IP}:\${PORT}/.architecture-review/"
echo "  Architecture map: http://\${LAN_IP}:\${PORT}/.architecture-map/"
\`\`\`

This is what gives you a way to **browse old plan-review HTMLs without having to invoke a full review skill** — your original motivation. The output prints the common URL prefixes so you can paste straight into the browser.`

    // Render markdown-like content to HTML
    function renderMarkdown(text) {
      let html = '';
      const lines = text.split('\n');
      let inCode = false;
      let codeLang = '';
      let codeLines = [];
      let inList = false;
      let listTag = 'ul';
      let inTable = false;
      let tableRows = [];

      for (let i = 0; i < lines.length; i++) {
        const line = lines[i];

        if (line.trim().startsWith('```')) {
          if (inCode) {
            if (codeLang === 'mermaid') {
              html += '<div class="mermaid-container"><pre class="mermaid">' + codeLines.join('\n') + '</pre></div>';
            } else {
              html += '<pre><code>' + codeLines.join('\n').replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</code></pre>';
            }
            codeLines = [];
            inCode = false;
            codeLang = '';
          } else {
            if (inList) { html += '</' + listTag + '>'; inList = false; }
            if (inTable) { html += renderTable(tableRows); inTable = false; tableRows = []; }
            codeLang = line.trim().slice(3).trim().toLowerCase();
            inCode = true;
          }
          continue;
        }
        if (inCode) { codeLines.push(line); continue; }

        if (line.trim().startsWith('|')) {
          if (inList) { html += '</' + listTag + '>'; inList = false; }
          if (!inTable) inTable = true;
          if (!line.trim().match(/^\|[\s-|]+\|$/)) {
            tableRows.push(line);
          }
          continue;
        } else if (inTable) {
          html += renderTable(tableRows);
          inTable = false;
          tableRows = [];
        }

        if (line.trim() === '') {
          if (inList) {
            // Look ahead: if next non-blank line continues the list, keep it open
            let keepList = false;
            for (let j = i + 1; j < lines.length; j++) {
              const next = lines[j].trim();
              if (next === '') continue;
              if (listTag === 'ol' && next.match(/^\d+\.\s/)) keepList = true;
              if (listTag === 'ul' && (next.startsWith('- ') || next.startsWith('* '))) keepList = true;
              break;
            }
            if (!keepList) { html += '</' + listTag + '>'; inList = false; }
          }
          continue;
        }

        if (line.startsWith('### ')) {
          if (inList) { html += '</' + listTag + '>'; inList = false; }
          html += '<h4 style="font-size:14px;font-weight:600;color:var(--text);margin:16px 0 8px">' + inlineFormat(line.slice(4)) + '</h4>';
          continue;
        }

        if (line.trim().startsWith('- ') || line.trim().startsWith('* ')) {
          if (inList && listTag !== 'ul') { html += '</' + listTag + '>'; inList = false; }
          if (!inList) { listTag = 'ul'; html += '<ul>'; inList = true; }
          html += '<li>' + inlineFormat(line.trim().slice(2)) + '</li>';
          continue;
        }
        if (line.trim().match(/^\d+\.\s/)) {
          if (inList && listTag !== 'ol') { html += '</' + listTag + '>'; inList = false; }
          if (!inList) { listTag = 'ol'; html += '<ol>'; inList = true; }
          html += '<li>' + inlineFormat(line.trim().replace(/^\d+\.\s/, '')) + '</li>';
          continue;
        }

        if (inList) { html += '</' + listTag + '>'; inList = false; }
        html += '<p>' + inlineFormat(line) + '</p>';
      }

      if (inCode) html += '<pre><code>' + codeLines.join('\n').replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</code></pre>';
      if (inList) html += '</' + listTag + '>';
      if (inTable) html += renderTable(tableRows);

      return html;
    }

    function renderTable(rows) {
      if (rows.length === 0) return '';
      let html = '<table>';
      rows.forEach((row, idx) => {
        const cells = row.split('|').filter(c => c.trim() !== '');
        const tag = idx === 0 ? 'th' : 'td';
        html += '<tr>' + cells.map(c => `<${tag}>${inlineFormat(c.trim())}</${tag}>`).join('') + '</tr>';
      });
      html += '</table>';
      return html;
    }

    function inlineFormat(text) {
      return text
        .replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/`([^`]+)`/g, '<code>$1</code>')
        .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
        .replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" style="color:var(--accent);text-decoration:none">$1</a>')
        .replace(/\\`/g, '`');

      const termPanel = document.getElementById('termPanel');
      const leftHandle = document.getElementById('leftHandle');
      const rightHandle = document.getElementById('rightHandle');
      const termHandle = document.getElementById('termHandle');
      const leftToggle = document.getElementById('leftToggle');
      const rightToggle = document.getElementById('rightToggle');
      const termToggle = document.getElementById('termToggle');

      let dragging = null;
      let navWidth = 240;
      let rightWidth = 360;
      let termWidth = 460;

      // Restore saved layout
      const savedLayout = (() => { try { return JSON.parse(localStorage.getItem(LAYOUT_KEY) || '{}'); } catch (e) { return {}; } })();
      if (savedLayout.navWidth) navWidth = savedLayout.navWidth;
      if (savedLayout.rightWidth) rightWidth = savedLayout.rightWidth;
      if (savedLayout.termWidth) termWidth = savedLayout.termWidth;
      if (savedLayout.navCollapsed) nav.classList.add('collapsed');
      else nav.style.width = navWidth + 'px';
      if (savedLayout.rightCollapsed) rightPanel.classList.add('collapsed');
      else rightPanel.style.width = rightWidth + 'px';
      // Terminal defaults to closed; only expand if user previously opened it.
      if (savedLayout.termCollapsed === false) termPanel.style.width = termWidth + 'px';
      else termPanel.classList.add('collapsed');

      function saveLayout() {
        try {
          localStorage.setItem(LAYOUT_KEY, JSON.stringify({
            navWidth, rightWidth, termWidth,
            navCollapsed: nav.classList.contains('collapsed'),
            rightCollapsed: rightPanel.classList.contains('collapsed'),
            termCollapsed: termPanel.classList.contains('collapsed')
          }));
        } catch (e) { }
      }

      function updateToggles() {
        const navCollapsed = nav.classList.contains('collapsed');
        const rightCollapsed = rightPanel.classList.contains('collapsed');
        const termCollapsed = termPanel.classList.contains('collapsed');
        leftToggle.title = navCollapsed ? 'Show sections' : 'Hide sections';
        leftToggle.classList.toggle('panel-collapsed', navCollapsed);
        rightToggle.title = rightCollapsed ? 'Show feedback' : 'Hide feedback';
        rightToggle.classList.toggle('panel-collapsed', rightCollapsed);
        termToggle.title = termCollapsed ? 'Show terminal' : 'Hide terminal';
        termToggle.classList.toggle('panel-collapsed', termCollapsed);
      }

      function toggleNav(e) {
        e.preventDefault();
        e.stopPropagation();
        if (nav.classList.contains('collapsed')) {
          nav.classList.remove('collapsed');
          nav.style.width = navWidth + 'px';
        } else {
          navWidth = nav.offsetWidth;
          nav.classList.add('collapsed');
        }
        updateToggles();
        saveLayout();
      }

      function toggleRight(e) {
        e.preventDefault();
        e.stopPropagation();
        if (rightPanel.classList.contains('collapsed')) {
          // Opening feedback — close terminal first AND inherit its width.
          if (!termPanel.classList.contains('collapsed')) {
            termWidth = termPanel.offsetWidth;
            rightWidth = termWidth;
            termPanel.classList.add('collapsed');
          }
          rightPanel.classList.remove('collapsed');
          rightPanel.style.width = rightWidth + 'px';
        } else {
          rightWidth = rightPanel.offsetWidth;
          rightPanel.classList.add('collapsed');
        }
        updateToggles();
        saveLayout();
      }

      function toggleTerm(e) {
        e.preventDefault();
        e.stopPropagation();
        if (termPanel.classList.contains('collapsed')) {
          // Opening terminal — close feedback first AND inherit its width.
          if (!rightPanel.classList.contains('collapsed')) {
            rightWidth = rightPanel.offsetWidth;
            termWidth = rightWidth;
            rightPanel.classList.add('collapsed');
          }
          termPanel.classList.remove('collapsed');
          termPanel.style.width = termWidth + 'px';
          setTimeout(__fitTerminal, 220);
        } else {
          termWidth = termPanel.offsetWidth;
          termPanel.classList.add('collapsed');
        }
        updateToggles();
        saveLayout();
      }

      let touchFiredLeft = false, touchFiredRight = false, touchFiredTerm = false;

      leftToggle.addEventListener('touchend', e => { touchFiredLeft = true; toggleNav(e); }, { passive: false });
      leftToggle.addEventListener('click', e => { if (touchFiredLeft) { touchFiredLeft = false; return; } toggleNav(e); });

      rightToggle.addEventListener('touchend', e => { touchFiredRight = true; toggleRight(e); }, { passive: false });
      rightToggle.addEventListener('click', e => { if (touchFiredRight) { touchFiredRight = false; return; } toggleRight(e); });

      termToggle.addEventListener('touchend', e => { touchFiredTerm = true; toggleTerm(e); }, { passive: false });
      termToggle.addEventListener('click', e => { if (touchFiredTerm) { touchFiredTerm = false; return; } toggleTerm(e); });

      updateToggles();

      // Drag resize (mouse)
      function onDragStart(e, side) {
        e.preventDefault();
        dragging = side;
        document.body.classList.add('resizing');
        const handle = side === 'left' ? leftHandle : (side === 'term' ? termHandle : rightHandle);
        handle.classList.add('dragging');
      }

      leftHandle.addEventListener('mousedown', e => onDragStart(e, 'left'));
      termHandle.addEventListener('mousedown', e => onDragStart(e, 'term'));
      rightHandle.addEventListener('mousedown', e => onDragStart(e, 'right'));

      document.addEventListener('mousemove', e => {
        if (!dragging) return;
        applyDrag(e.clientX);
      });

      document.addEventListener('mouseup', endDrag);

      // Drag resize (touch)
      leftHandle.addEventListener('touchstart', e => { e.preventDefault(); onDragStart(e, 'left'); }, { passive: false });
      termHandle.addEventListener('touchstart', e => { e.preventDefault(); onDragStart(e, 'term'); }, { passive: false });
      rightHandle.addEventListener('touchstart', e => { e.preventDefault(); onDragStart(e, 'right'); }, { passive: false });

      document.addEventListener('touchmove', e => {
        if (!dragging) return;
        e.preventDefault();
        applyDrag(e.touches[0].clientX);
      }, { passive: false });

      document.addEventListener('touchend', endDrag);

      function applyDrag(clientX) {
        if (dragging === 'left') {
          const w = Math.max(140, Math.min(400, clientX));
          nav.classList.remove('collapsed');
          nav.style.width = w + 'px';
          navWidth = w;
        } else if (dragging === 'right') {
          const w = Math.max(200, Math.min(600, window.innerWidth - clientX));
          rightPanel.classList.remove('collapsed');
          rightPanel.style.width = w + 'px';
          rightWidth = w;
        } else if (dragging === 'term') {
          // termHandle sits between doc and terminal; the terminal's width is
          // (everything to the right of clientX) minus the right-panel width
          // (when expanded) and the right resize handle (1px).
          const rightTaken = rightPanel.classList.contains('collapsed') ? 0 : rightPanel.offsetWidth + 1;
          const w = Math.max(240, Math.min(900, window.innerWidth - clientX - rightTaken));
          termPanel.classList.remove('collapsed');
          termPanel.style.width = w + 'px';
          termWidth = w;
          __fitTerminal();
        }
        updateToggles();
      }

      function endDrag() {
        if (!dragging) return;
        document.body.classList.remove('resizing');
        leftHandle.classList.remove('dragging');
        rightHandle.classList.remove('dragging');
        termHandle.classList.remove('dragging');
        dragging = null;
        saveLayout();
        __fitTerminal();
      }

      // Re-fit terminal on viewport changes
      window.addEventListener('resize', () => __fitTerminal());
    })();

    // ============================================================
    // TT-127: Terminal panel + Send to Claude
    // Mounts xterm.js in #termHost, opens a websocket to the
    // devserver's /api/claude endpoint (which spawns
    // `claude --resume <sid>` in a PTY), and exposes sendToClaude()
    // which writes the existing feedback bundle to that session.
    // ============================================================
    let __claudeWS = null;
    let __claudeReady = false;
    let __claudeTerm = null;
    let __claudeFitAddon = null;

    (function initClaudeTerminal() {
      const host = document.getElementById('termHost');
      const status = document.getElementById('termStatus');
      const sendBtn = document.getElementById('sendClaudeBtn');
      if (!host || typeof Terminal === 'undefined') return;

      const term = new Terminal({
        fontFamily: '"SF Mono", "Fira Code", "JetBrains Mono", monospace',
        fontSize: 12,
        lineHeight: 1.2,
        theme: {
          background: '#161b22',
          foreground: '#e6edf3',
          cursor: '#58a6ff',
          selectionBackground: 'rgba(88, 166, 255, 0.35)',
        },
        cursorBlink: true,
        scrollback: 5000,
        convertEol: false,
      });
      const fitAddon = new FitAddon.FitAddon();
      term.loadAddon(fitAddon);
      term.open(host);
      try { fitAddon.fit(); } catch (e) { }

      __claudeTerm = term;
      __claudeFitAddon = fitAddon;
      __fitTerminal = () => {
        if (document.getElementById('termPanel').classList.contains('collapsed')) return;
        try { fitAddon.fit(); } catch (e) { }
        if (__claudeReady && __claudeWS && __claudeWS.readyState === WebSocket.OPEN) {
          try {
            __claudeWS.send(JSON.stringify({ type: 'resize', cols: term.cols, rows: term.rows }));
          } catch (e) { }
        }
      };

      function setStatus(text, kind) {
        status.textContent = text;
        status.classList.remove('connected', 'error');
        if (kind) status.classList.add(kind);
      }

      function connect() {
        if (!CLAUDE_SESSION || CLAUDE_SESSION === "SESSION_ID_HERE") {
          setStatus('error', 'error');
          term.writeln('\r\n[devserver] Session ID not embedded in this review doc.');
          term.writeln('[devserver] Regenerate with /plan-review so the current session id is captured.\r\n');
          return;
        }
        const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
        const url = `${proto}//${location.host}/api/claude?session=${encodeURIComponent(CLAUDE_SESSION)}`;
        setStatus('connecting…');
        let ws;
        try {
          ws = new WebSocket(url);
        } catch (e) {
          setStatus('error', 'error');
          term.writeln(`\r\n[devserver] failed to open ${url}: ${e}\r\n`);
          return;
        }
        ws.binaryType = 'arraybuffer';
        __claudeWS = ws;

        ws.onopen = () => {
          __claudeReady = true;
          setStatus('connected', 'connected');
          sendBtn.disabled = false;
          // send initial size so PTY matches xterm
          try {
            ws.send(JSON.stringify({ type: 'resize', cols: term.cols, rows: term.rows }));
          } catch (e) { }
        };

        ws.onmessage = (ev) => {
          if (typeof ev.data === 'string') {
            // control message (e.g. error JSON); print to terminal for visibility
            term.writeln('\r\n[devserver] ' + ev.data);
            return;
          }
          term.write(new Uint8Array(ev.data));
        };

        ws.onerror = () => {
          setStatus('error', 'error');
        };

        ws.onclose = () => {
          __claudeReady = false;
          sendBtn.disabled = true;
          setStatus('disconnected');
          term.writeln('\r\n[devserver] session closed. refresh page to reconnect.\r\n');
        };

        const encoder = new TextEncoder();
        term.onData((data) => {
          if (ws.readyState !== WebSocket.OPEN) return;
          try { ws.send(encoder.encode(data)); } catch (e) { }
        });

        term.onResize(({ cols, rows }) => {
          if (ws.readyState !== WebSocket.OPEN) return;
          try { ws.send(JSON.stringify({ type: 'resize', cols, rows })); } catch (e) { }
        });
      }

      // Handoff UI (TT-130): populate session id, wire up the "Hand off to terminal" button.
      const handoffSid = document.getElementById('handoffSid');
      const handoffBtn = document.getElementById('handoffBtn');
      const handoffStatus = document.getElementById('handoffStatus');
      if (handoffSid && CLAUDE_SESSION && CLAUDE_SESSION !== 'SESSION_ID_HERE') {
        handoffSid.textContent = CLAUDE_SESSION;
        handoffSid.title = CLAUDE_SESSION;
      } else if (handoffSid) {
        handoffSid.textContent = '(not embedded — regenerate with /plan-review)';
      }
      if (handoffBtn) {
        handoffBtn.addEventListener('click', async () => {
          if (!CLAUDE_SESSION || CLAUDE_SESSION === 'SESSION_ID_HERE') {
            handoffStatus.textContent = 'No session id embedded in this review doc.';
            return;
          }
          const cmd = `claude --resume ${CLAUDE_SESSION}`;
          let copied = false;
          try {
            await navigator.clipboard.writeText(cmd);
            copied = true;
          } catch (e) { /* non-HTTPS or denied — fall through */ }
          if (__claudeWS && __claudeWS.readyState === WebSocket.OPEN) {
            try { __claudeWS.send(new Uint8Array([0x04])); } catch (e) { }
          }
          // Render the command on its own line so triple-click selects just the command.
          handoffStatus.textContent = '';
          const label = document.createElement('div');
          label.textContent = copied
            ? 'Copied to clipboard — paste this in your terminal:'
            : 'Run this in your terminal:';
          const cmdLine = document.createElement('code');
          cmdLine.className = 'handoff-status-cmd';
          cmdLine.textContent = cmd;
          handoffStatus.appendChild(label);
          handoffStatus.appendChild(cmdLine);
          handoffStatus.classList.add('done');
          handoffBtn.disabled = true;
          handoffBtn.textContent = 'Session released';
        });
      }

      connect();
    })();

    function sendToClaude() {
      const btn = document.getElementById('sendClaudeBtn');
      const prompt = generatePrompt();
      if (!prompt) return;
      if (!__claudeWS || __claudeWS.readyState !== WebSocket.OPEN) {
        btn.textContent = 'Terminal disconnected';
        setTimeout(() => { btn.textContent = 'Send to Claude'; }, 2000);
        return;
      }
      // On send: open terminal panel, collapse feedback panel — single focused surface.
      const termPanel = document.getElementById('termPanel');
      const rightPanel = document.getElementById('rightPanel');
      if (termPanel.classList.contains('collapsed')) {
        document.getElementById('termToggle').click();
      }
      if (!rightPanel.classList.contains('collapsed')) {
        document.getElementById('rightToggle').click();
      }
      const encoder = new TextEncoder();
      // Newline at the end so Claude Code submits the bundle as one turn.
      __claudeWS.send(encoder.encode(prompt + '\n'));
      btn.textContent = 'Sent';
      btn.classList.add('sent');
      if (__claudeTerm) __claudeTerm.focus();
      // Snap the terminal viewport to the bottom. The PTY echo arrives in
      // chunks and the panel-open fit() runs at +220ms, so one scroll isn't
      // enough — cover the animation frame, the post-fit reflow, and any
      // trailing echo.
      const snapToBottom = () => { if (__claudeTerm) __claudeTerm.scrollToBottom(); };
      requestAnimationFrame(snapToBottom);
      setTimeout(snapToBottom, 260);
      setTimeout(snapToBottom, 600);
      setTimeout(() => {
        btn.textContent = 'Send to Claude';
        btn.classList.remove('sent');
      }, 2000);
    }

    mermaid.initialize({ startOnLoad: false, theme: 'dark', themeVariables: {
      primaryColor: '#1c2128', primaryTextColor: '#e6edf3', primaryBorderColor: '#30363d',
      lineColor: '#58a6ff', secondaryColor: '#161b22', tertiaryColor: '#21262d',
      nodeTextColor: '#e6edf3', edgeLabelBackground: '#161b22'
    }});

    loadFromStorage();
    document.querySelectorAll('.filter-tab').forEach(t => {
      t.classList.toggle('active', t.dataset.filter === state.activeFilter);
    });
    renderAll();
  </script>
</body>

</html>
